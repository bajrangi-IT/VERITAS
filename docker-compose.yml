# ==============================================================================
# VERITAS AI - Docker Compose Configuration (1-Click Local Deployment)
# Usage: docker compose up --build
# ==============================================================================

version: '3.8'

services:
  veritas-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-ai-platform
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SEARCH_PROVIDER=hybrid
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
